name: publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/allenday/actions-stub

jobs:
  publish-app-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build app image
        run: docker build --tag "$IMAGE_NAME:${{ github.sha }}" .

      - name: Tag main image
        if: github.ref == 'refs/heads/main'
        run: docker tag "$IMAGE_NAME:${{ github.sha }}" "$IMAGE_NAME:latest"

      - name: Tag version image
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker tag "$IMAGE_NAME:${{ github.sha }}" "$IMAGE_NAME:${{ github.ref_name }}"

      - name: Push app image tags
        run: |
          set -eu

          push_with_retry() {
            image="$1"
            attempt=1
            max_attempts=4

            while [ "$attempt" -le "$max_attempts" ]; do
              if docker push "$image"; then
                return 0
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "docker push failed after ${max_attempts} attempts: ${image}" >&2
                return 1
              fi

              delay=$((attempt * 60))
              echo "docker push failed for ${image}; retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          push_with_retry "$IMAGE_NAME:${{ github.sha }}"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            push_with_retry "$IMAGE_NAME:latest"
          fi

          case "${GITHUB_REF}" in
            refs/tags/v*)
              push_with_retry "$IMAGE_NAME:${GITHUB_REF_NAME}"
              ;;
          esac
